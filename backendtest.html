<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>簡單 CRUD 測試</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
        }

        h1 {
            margin-bottom: 20px;
        }

        .input-area {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input {
            padding: 8px;
            font-size: 16px;
        }

        button {
            padding: 8px 15px;
            cursor: pointer;
            border: 1px solid #ccc;
            background: #f5f5f5;
            border-radius: 4px;
        }

        button:hover {
            background: #e5e5e5;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: left;
        }

        th {
            background: #f0f0f0;
        }

        .message {
            margin-top: 20px;
            padding: 10px;
            background: #f5f5f5;
        }
    </style>
</head>

<body>

<h1>簡單 CRUD 測試</h1>

<div class="input-area">
    <input type="text" id="nameInput" placeholder="輸入名稱">
    <button onclick="createData()">新增</button>
</div>

<table>
    <thead>
        <tr>
            <th>ID</th>
            <th>名稱</th>
            <th>操作</th>
        </tr>
    </thead>

    <tbody id="dataTable">
    </tbody>
</table>

<div class="message" id="message">
    正在讀取資料...
</div>

<script>

let dataList = [];

/*
 * =========================
 * READ
 * =========================
 */
async function readData() {

    try {

        const response = await fetch("backend.txt");

        if (!response.ok) {
            throw new Error("無法讀取 backend.txt");
        }

        const text = await response.text();

        dataList = [];

        const lines = text
            .split(/\r?\n/)
            .filter(line => line.trim() !== "");

        lines.forEach(line => {

            const parts = line.split("|");

            if (parts.length >= 2) {

                dataList.push({
                    id: parts[0],
                    name: parts.slice(1).join("|")
                });

            }

        });

        renderTable();

        showMessage("資料讀取成功");

    } catch (error) {

        console.error(error);

        showMessage("讀取失敗：" + error.message);

    }
}


/*
 * =========================
 * 顯示資料
 * =========================
 */
function renderTable() {

    const table = document.getElementById("dataTable");

    table.innerHTML = "";

    dataList.forEach(item => {

        const row = document.createElement("tr");

        row.innerHTML = `
            <td>${escapeHtml(item.id)}</td>

            <td>
                <span id="name-${item.id}">
                    ${escapeHtml(item.name)}
                </span>

                <input
                    id="edit-${item.id}"
                    type="text"
                    value="${escapeHtml(item.name)}"
                    style="display:none;"
                >
            </td>

            <td>

                <button onclick="startEdit('${item.id}')">
                    修改
                </button>

                <button onclick="updateData('${item.id}')">
                    儲存
                </button>

                <button onclick="deleteData('${item.id}')">
                    刪除
                </button>

            </td>
        `;

        table.appendChild(row);

    });
}


/*
 * =========================
 * CREATE
 * =========================
 */
function createData() {

    const input = document.getElementById("nameInput");

    const name = input.value.trim();

    if (!name) {

        alert("請輸入名稱");

        return;

    }

    /*
     * 找目前最大的 ID
     */
    let maxId = 0;

    dataList.forEach(item => {

        const id = parseInt(item.id);

        if (!isNaN(id) && id > maxId) {
            maxId = id;
        }

    });

    const newId = maxId + 1;

    dataList.push({
        id: String(newId),
        name: name
    });

    input.value = "";

    renderTable();

    showMessage("新增成功，但尚未寫回 backend.txt");

}


/*
 * =========================
 * UPDATE
 * =========================
 */
function startEdit(id) {

    const nameSpan = document.getElementById("name-" + id);

    const input = document.getElementById("edit-" + id);

    nameSpan.style.display = "none";

    input.style.display = "inline-block";

    input.focus();

}


function updateData(id) {

    const input = document.getElementById("edit-" + id);

    const newName = input.value.trim();

    if (!newName) {

        alert("名稱不能為空");

        return;

    }

    const item = dataList.find(item => item.id === id);

    if (!item) {
        return;
    }

    item.name = newName;

    renderTable();

    showMessage("修改成功，但尚未寫回 backend.txt");

}


/*
 * =========================
 * DELETE
 * =========================
 */
function deleteData(id) {

    const confirmDelete = confirm(
        "確定要刪除 ID " + id + " 嗎？"
    );

    if (!confirmDelete) {
        return;
    }

    dataList = dataList.filter(item => item.id !== id);

    renderTable();

    showMessage("刪除成功，但尚未寫回 backend.txt");

}


/*
 * =========================
 * 顯示訊息
 * =========================
 */
function showMessage(message) {

    document.getElementById("message").textContent = message;

}


/*
 * =========================
 * 防止 HTML 注入
 * =========================
 */
function escapeHtml(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/*
 * =========================
 * 啟動
 * =========================
 */
readData();

</script>

</body>
</html>
