<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>資料管理</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 40px 20px;

            font-family:
                Arial,
                "Microsoft JhengHei",
                sans-serif;

            background: #f5f5f5;
        }

        .container {
            max-width: 800px;

            margin: auto;

            padding: 25px;

            background: white;

            border-radius: 12px;

            box-shadow:
                0 3px 15px
                rgba(0, 0, 0, 0.1);
        }

        h1 {
            margin-top: 0;
        }

        .add-area {
            display: flex;

            gap: 10px;

            margin-bottom: 25px;
        }

        .add-area input {
            flex: 1;

            padding: 10px;

            font-size: 16px;

            border: 1px solid #ccc;

            border-radius: 6px;
        }

        button {
            padding: 9px 15px;

            border: 1px solid #ccc;

            border-radius: 6px;

            background: white;

            cursor: pointer;
        }

        button:hover {
            background: #eeeeee;
        }

        table {
            width: 100%;

            border-collapse: collapse;
        }

        th,
        td {
            padding: 10px;

            border-bottom: 1px solid #ddd;

            text-align: left;
        }

        th {
            background: #f5f5f5;
        }

        .edit-input {
            width: 100%;

            padding: 7px;

            border: 1px solid #aaa;

            border-radius: 5px;
        }

        .message {
            margin-top: 20px;

            padding: 12px;

            border-radius: 6px;

            background: #f0f0f0;
        }

        .success {
            background: #e5ffe5;

            color: #006600;
        }

        .error {
            background: #ffe5e5;

            color: #aa0000;
        }

        .loading {
            opacity: 0.6;

            pointer-events: none;
        }

    </style>

</head>

<body>

<div
    id="app"
    class="container"
>

    <h1>資料管理</h1>

    <div class="add-area">

        <input
            id="nameInput"
            type="text"
            placeholder="輸入名稱"
        >

        <button
            onclick="createData()"
        >
            新增
        </button>

        <button
            onclick="readData()"
        >
            重新整理
        </button>

    </div>


    <table>

        <thead>

            <tr>

                <th>ID</th>

                <th>名稱</th>

                <th>操作</th>

            </tr>

        </thead>

        <tbody
            id="dataTable"
        ></tbody>

    </table>


    <div
        id="message"
        class="message"
    >
        正在讀取資料...
    </div>

</div>


<script>

/*
==================================================
Vercel API
==================================================

部署 Vercel Function 後，
把這裡改成你的網址。

例如：

https://fox-crud.vercel.app/api/data
*/

const API_URL =
    "https://foxzicool-github-io.vercel.app/api/data";


let dataList = [];


/*
==================================================
READ
==================================================
*/

async function readData() {

    try {

        setLoading(true);

        showMessage(
            "正在讀取資料...",
            false
        );

        const response =
            await fetch(
                API_URL
            );

        const result =
            await response.json();

        if (!response.ok) {

            throw new Error(
                result.error ||
                "讀取失敗"
            );

        }

        dataList =
            result;

        renderTable();

        showMessage(
            "讀取成功，共 " +
            dataList.length +
            " 筆資料",
            false
        );

    }
    catch (error) {

        console.error(error);

        showMessage(
            "讀取失敗：" +
            error.message,
            true
        );

    }
    finally {

        setLoading(false);

    }

}


/*
==================================================
CREATE
==================================================
*/

async function createData() {

    const input =
        document.getElementById(
            "nameInput"
        );

    const name =
        input.value.trim();

    if (!name) {

        alert("請輸入名稱");

        return;

    }

    try {

        setLoading(true);

        showMessage(
            "正在新增...",
            false
        );

        const response =
            await fetch(
                API_URL,
                {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            name: name
                        })

                }
            );

        const result =
            await response.json();

        if (!response.ok) {

            throw new Error(
                result.error ||
                "新增失敗"
            );

        }

        input.value = "";

        await readData();

        showMessage(
            "新增成功",
            false
        );

    }
    catch (error) {

        console.error(error);

        showMessage(
            "新增失敗：" +
            error.message,
            true
        );

    }
    finally {

        setLoading(false);

    }

}


/*
==================================================
UPDATE
==================================================
*/

async function updateData(id) {

    const input =
        document.getElementById(
            "edit-" + id
        );

    const name =
        input.value.trim();

    if (!name) {

        alert("名稱不能為空");

        return;

    }

    try {

        setLoading(true);

        showMessage(
            "正在修改...",
            false
        );

        const response =
            await fetch(
                API_URL +
                "/" +
                encodeURIComponent(id),
                {

                    method: "PUT",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            name: name
                        })

                }
            );

        const result =
            await response.json();

        if (!response.ok) {

            throw new Error(
                result.error ||
                "修改失敗"
            );

        }

        await readData();

        showMessage(
            "修改成功",
            false
        );

    }
    catch (error) {

        console.error(error);

        showMessage(
            "修改失敗：" +
            error.message,
            true
        );

    }
    finally {

        setLoading(false);

    }

}


/*
==================================================
DELETE
==================================================
*/

async function deleteData(id) {

    if (
        !confirm(
            "確定要刪除這筆資料嗎？"
        )
    ) {

        return;

    }

    try {

        setLoading(true);

        showMessage(
            "正在刪除...",
            false
        );

        const response =
            await fetch(
                API_URL +
                "/" +
                encodeURIComponent(id),
                {

                    method: "DELETE"

                }
            );

        const result =
            await response.json();

        if (!response.ok) {

            throw new Error(
                result.error ||
                "刪除失敗"
            );

        }

        await readData();

        showMessage(
            "刪除成功",
            false
        );

    }
    catch (error) {

        console.error(error);

        showMessage(
            "刪除失敗：" +
            error.message,
            true
        );

    }
    finally {

        setLoading(false);

    }

}


/*
==================================================
畫面
==================================================
*/

function renderTable() {

    const table =
        document.getElementById(
            "dataTable"
        );

    table.innerHTML = "";


    if (
        dataList.length === 0
    ) {

        table.innerHTML = `

            <tr>

                <td
                    colspan="3"
                    style="text-align:center;"
                >
                    沒有資料
                </td>

            </tr>

        `;

        return;

    }


    dataList.forEach(
        item => {

            const row =
                document.createElement(
                    "tr"
                );


            row.innerHTML = `

                <td>
                    ${escapeHtml(item.id)}
                </td>

                <td>

                    <span
                        id="name-${escapeHtml(item.id)}"
                    >
                        ${escapeHtml(item.name)}
                    </span>

                    <input
                        id="edit-${escapeHtml(item.id)}"
                        class="edit-input"
                        type="text"
                        value="${escapeHtml(item.name)}"
                        style="display:none;"
                    >

                </td>

                <td>

                    <button
                        onclick="startEdit('${escapeJs(item.id)}')"
                    >
                        修改
                    </button>

                    <button
                        onclick="updateData('${escapeJs(item.id)}')"
                    >
                        儲存
                    </button>

                    <button
                        onclick="deleteData('${escapeJs(item.id)}')"
                    >
                        刪除
                    </button>

                </td>

            `;


            table.appendChild(row);

        }
    );

}


/*
==================================================
開始修改
==================================================
*/

function startEdit(id) {

    const name =
        document.getElementById(
            "name-" + id
        );

    const input =
        document.getElementById(
            "edit-" + id
        );

    name.style.display =
        "none";

    input.style.display =
        "block";

    input.focus();

}


/*
==================================================
HTML 安全
==================================================
*/

function escapeHtml(value) {

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/*
==================================================
JavaScript 字串安全
==================================================
*/

function escapeJs(value) {

    return String(value)

        .replace(
            /\\/g,
            "\\\\"
        )

        .replace(
            /'/g,
            "\\'"
        );

}


/*
==================================================
訊息
==================================================
*/

function showMessage(
    message,
    error
) {

    const element =
        document.getElementById(
            "message"
        );

    element.textContent =
        message;

    element.className =
        "message";


    if (error) {

        element.classList.add(
            "error"
        );

    }
    else {

        element.classList.add(
            "success"
        );

    }

}


/*
==================================================
Loading
==================================================
*/

function setLoading(
    loading
) {

    const app =
        document.getElementById(
            "app"
        );

    if (loading) {

        app.classList.add(
            "loading"
        );

    }
    else {

        app.classList.remove(
            "loading"
        );

    }

}


/*
==================================================
Enter 新增
==================================================
*/

document
    .getElementById(
        "nameInput"
    )
    .addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter"
            ) {

                createData();

            }

        }
    );


/*
==================================================
啟動
==================================================
*/

readData();

</script>

</body>

</html>
